<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="let&#x27;s build something — vaibhavdangaich@gmail.com">
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#0E0E12"/><stop offset="100%" stop-color="#08080A"/></linearGradient>
<linearGradient id="fw" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C6A87C" stop-opacity="0"/><stop offset="45%" stop-color="#C6A87C" stop-opacity=".7"/><stop offset="100%" stop-color="#C6A87C" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="20s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="fglow" cx="50%" cy="120%" r="70%"><stop offset="0%" stop-color="#C6A87C" stop-opacity=".10"/><stop offset="100%" stop-color="#C6A87C" stop-opacity="0"/></radialGradient>
<filter id="fg" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer></filter>
<clipPath id="fc"><rect width="1200" height="190" rx="16"/></clipPath>
</defs>
<style>@keyframes bk{0%,49%{opacity:.9}50%,100%{opacity:0}}@keyframes hz{0%,100%{opacity:.20}50%{opacity:.42}}.bk{animation:bk 1.15s step-end infinite}.hz{animation:hz 9s ease-in-out infinite}</style>
<g clip-path="url(#fc)">
<rect width="1200" height="190" fill="url(#fbg)"/>
<rect width="1200" height="190" fill="url(#fglow)"/>
<path class="hz" d="M0 150 q 300 -22 600 0 t 600 0" fill="none" stroke="#F0EDE8" stroke-width=".8" opacity=".26" style="animation-delay:0.0s"/>
<path class="hz" d="M0 162 q 300 -22 600 0 t 600 0" fill="none" stroke="#F0EDE8" stroke-width=".8" opacity=".18" style="animation-delay:1.4s"/>
<path class="hz" d="M0 174 q 300 -22 600 0 t 600 0" fill="none" stroke="#F0EDE8" stroke-width=".8" opacity=".11" style="animation-delay:2.8s"/>
<text x="600.0" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="4.6" fill="#4E4E58">GOT AN IDEA WORTH BUILDING?</text>
<text x="600.0" y="112" text-anchor="middle" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="40" letter-spacing="1" fill="#F0EDE8">Let&#8217;s make it run.</text>
<rect x="510.0" y="126" width="180" height="1" fill="url(#fw)"/>
<text x="592.0" y="154" text-anchor="middle" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9A9AA4"><tspan fill="#4E4E58">~ $ </tspan>mail vaibhavdangaich@gmail.com</text>
<rect class="bk" x="740" y="143" width="7" height="13" fill="#C6A87C"/>
<rect width="1200" height="190" filter="url(#fg)" opacity=".045" style="mix-blend-mode:overlay"/>
<rect x=".5" y=".5" width="1199" height="189" rx="16" fill="none" stroke="#26262E" stroke-width="1"/>
</g></svg>