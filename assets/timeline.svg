<text x="1100" y="49" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7aa2f7">May 2026 – Jul 2026</text>
<text x="96" y="74" font-size="13.5" fill="#8b93b8">Cohort learning platform on Next.js + Node/TypeScript over Azure — enrollment, scheduling, streaks, XP leaderboards, certificates.</text>
<text x="96" y="96" font-size="13.5" fill="#8b93b8">Owned monetization: Razorpay orders, subscriptions and webhooks, idempotent entitlements, a ledger-based credits system across 3 tiers.</text>
<text x="96" y="118" font-size="13.5" fill="#8b93b8">Built a recommendation engine on vector embeddings and semantic search (Azure OpenAI) targeting each learner&#x27;s weak concepts.</text>
