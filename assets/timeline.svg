<text x="100" y="76" font-size="13.5" fill="#9A9AA4">Cohort learning platform on Next.js + Node/TypeScript over Azure — enrollment, scheduling, streaks, XP leaderboards, certificates.</text>
<text x="100" y="98" font-size="13.5" fill="#9A9AA4">Owned monetization: Razorpay orders, subscriptions and webhooks, idempotent entitlements, a ledger-based credits system across 3 tiers.</text>
<text x="100" y="120" font-size="13.5" fill="#9A9AA4">Built a recommendation engine on vector embeddings and semantic search (Azure OpenAI) targeting each learner&#x27;s weak concepts.</text>
