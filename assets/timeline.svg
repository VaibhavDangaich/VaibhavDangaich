<text x="1097" y="195.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9A9AA4">Feb 2026 – May 2026</text>
<text x="100" y="220" font-size="13.5" fill="#9A9AA4">Secure real-time ingestion with Apache NiFi + Kafka routing 4 document formats for a defence-oriented government intelligence project.</text>
<text x="100" y="242" font-size="13.5" fill="#9A9AA4">LangChain LLM workflows and Neo4j knowledge graphs lifted entity-search recall from 70% to 95% with zero false merges.</text>
