<text x="1099" y="193" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#bb9af7">Feb 2026 – May 2026</text>
<text x="96" y="218" font-size="13.5" fill="#8b93b8">Secure real-time ingestion with Apache NiFi + Kafka routing 4 document formats for a defence-oriented government intelligence project.</text>
<text x="96" y="240" font-size="13.5" fill="#8b93b8">LangChain LLM workflows and Neo4j knowledge graphs lifted entity-search recall from 70% to 95% with zero false merges.</text>
