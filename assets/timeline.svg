<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="experience timeline">
<defs>
<linearGradient id="tlbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#12141f"/><stop offset="100%" stop-color="#0b0d17"/></linearGradient>
<linearGradient id="spine" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7aa2f7" stop-opacity=".95"/><stop offset="55%" stop-color="#bb9af7" stop-opacity=".7"/><stop offset="100%" stop-color="#2ac3de" stop-opacity=".15"/></linearGradient>
<filter id="tg" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="tlc"><rect width="1200" height="512" rx="16"/></clipPath>
</defs>
<style>@keyframes np{0%,100%{opacity:.45}50%{opacity:1}}@keyframes fall{0%{transform:translateY(-14px);opacity:0}100%{transform:translateY(340px);opacity:0}12%{opacity:1}88%{opacity:1}}.np{animation:np 3s ease-in-out infinite}.fall{animation:fall 6s linear infinite}</style>
<g clip-path="url(#tlc)">
