<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t">
  <title id="t">Vaibhav Dangaich: AI agents, knowledge graphs, systems that finish the job</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0618"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <!-- Comic halftone, fading out toward the centre -->
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.1" fill="#ff2d55"/>
    </pattern>
    <radialGradient id="fade" cx="0.88" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="halftone"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .name { font: 900 76px 'Arial Black', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; }
      .mono { font: 500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cap  { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
      .web  { stroke: #f7f2ff; stroke-opacity: .16; fill: none; stroke-width: 1; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .strand { stroke-dasharray: 340; stroke-dashoffset: 340; animation: thwip 1.2s .3s ease-out forwards; }
      @keyframes thwip { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .strand { animation: none; stroke-dashoffset: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#halftone)"/>

    <!-- Corner web, top-left -->
    <g class="web">
      <path d="M0 0 L260 0 M0 0 L240 110 M0 0 L170 190 M0 0 L80 250 M0 0 L0 260"/>
      <path d="M62 0 Q55 22 58 27 Q35 38 41 46 Q25 52 20 62 Q8 62 0 63"/>
      <path d="M130 0 Q114 44 118 55 Q74 76 84 92 Q54 106 40 125 Q16 124 0 127"/>
      <path d="M200 0 Q176 66 180 84 Q114 116 128 140 Q82 160 60 188 Q24 186 0 192"/>
    </g>

    <!-- Web strand shooting in from the top right -->
    <path class="strand" d="M1200 0 L1010 150" stroke="#f7f2ff" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="1010" cy="150" r="3" fill="#f7f2ff" fill-opacity=".7"/>

    <text x="60" y="68" class="cap" fill="#ff2d55">§ 00 · HELLO, WORLD</text>

    <!-- Name with Spider-Verse misregistration -->
    <g class="name">
      <text x="57" y="165" fill="#2f6bff">Vaibhav Dangaich</text>
      <text x="63" y="161" fill="#ff2d55">Vaibhav Dangaich</text>
      <text x="60" y="163" fill="#f7f2ff">Vaibhav Dangaich</text>
    </g>

    <text x="62" y="210" class="mono" fill="#d4cbef">AI agents · knowledge graphs · systems that finish the job</text>
    <text x="62" y="256" class="mono" fill="#9a90c4">~ $ <tspan fill="#f7f2ff">build --something-that-outlives-the-session</tspan><tspan class="cursor" fill="#ff2d55"> █</tspan></text>

    <!-- Comic caption box -->
    <g transform="translate(960 232) rotate(-4)">
      <rect x="0" y="0" width="170" height="44" rx="4" fill="#ffe14a" stroke="#0a0618" stroke-width="3"/>
      <text x="85" y="29" text-anchor="middle" class="cap" fill="#0a0618" style="font-size:15px;letter-spacing:2px">THWIP!</text>
    </g>
  </g>
</svg>
