<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="1200" height="6" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7aa2f7" stop-opacity=".85"/>
      <stop offset="50%"  stop-color="#bb9af7" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#2ac3de" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#2ac3de" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.6 0; 0.6 0; -0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="1200" height="2" rx="1" fill="url(#d)"/>
</svg>
