<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="2 arXiv preprints · 400+ DSA problems · Top 5 of 200+ teams at IEEE CTF · CGPA 8.4 · mnex v1.5.1 on npm">
